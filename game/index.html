<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>맑고푸른곶 시화호 체험관</title>
<meta name="description" content="캐릭터로 시화호 마을을 걸으며 재단법인 맑고푸른곶의 업무(측정·분석, 활성탄 재생, 환경컨설팅, 환경교육)를 체험하는 3D 게임">
<meta name="theme-color" content="#23579C">
<link rel="icon" href="../icons/favicon-32.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{--ink:#14202b;--brand:#2e6fb7;--deep:#23579c;--navy:#0c3360;--leaf:#0a9466;--mint:#7ee3b4;--sky:#8fd6f4;--amber:#ffb547;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0c3360;font-family:var(--font);color:var(--ink);-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}

/* 시작 화면 */
#start{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,rgba(12,51,96,.92),rgba(35,87,156,.86) 55%,rgba(11,118,82,.86));overflow:auto}
.startcard{width:min(460px,100%);padding:28px 24px 22px;border-radius:22px;background:#fff;box-shadow:0 30px 70px -30px rgba(0,0,0,.6);text-align:center}
.startcard .emb{width:74px;height:74px;margin:0 auto 10px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px #eaf2fb}
.startcard h1{margin:4px 0 2px;font-size:26px;letter-spacing:-.05em}
.startcard h1 small{display:block;font-size:13px;color:var(--leaf);letter-spacing:.02em;margin-bottom:4px}
.startcard p{margin:8px 0 0;color:#4a5864;font-size:14.5px;line-height:1.65;word-break:keep-all}
.pick{margin:18px 0 6px;font-size:13px;font-weight:800;color:var(--deep);text-align:left}
.swatches{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.swatches button{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #dae3ea;transition:transform .15s}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--deep);transform:scale(1.08)}
#nick{width:100%;margin-top:6px;padding:12px 14px;border:1.5px solid #dae3ea;border-radius:12px;font:inherit;font-size:16px;text-align:center}
#nick:focus{outline:none;border-color:var(--brand)}
.go{width:100%;margin-top:16px;min-height:54px;border:0;border-radius:14px;background:var(--deep);color:#fff;font-size:18px;font-weight:800;letter-spacing:-.03em}
.go:active{transform:scale(.98)}
.howto{margin-top:12px;font-size:12.5px;color:#66737e;line-height:1.6}
.reset{margin-top:6px;border:0;background:none;color:#99a6b0;font-size:12px;text-decoration:underline}

/* HUD */
#hud{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));z-index:10;display:grid;gap:8px;max-width:min(330px,calc(100vw - 150px))}
.panel{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);box-shadow:0 10px 26px -14px rgba(0,0,0,.5)}
.stamps{display:flex;gap:6px;align-items:center}
.stamps b{font-size:12px;color:var(--deep);margin-right:2px;white-space:nowrap}
.stamp{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:#eef2f5;color:#b3bec7;border:2px dashed #cdd7df;transition:all .4s}
.stamp.on{background:var(--leaf);color:#fff;border:2px solid #fff;box-shadow:0 0 0 2px var(--leaf);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3)}to{transform:none}}
#mission{font-size:13.5px;line-height:1.5;word-break:keep-all}
#mission b{color:var(--deep)}
#drops{font-size:12px;color:#5b6b78}
#top{position:fixed;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));z-index:10;display:flex;gap:6px}
#top button{min-height:40px;padding:0 12px;border:0;border-radius:12px;background:rgba(255,255,255,.92);font-size:13px;font-weight:800;color:var(--navy);box-shadow:0 10px 26px -14px rgba(0,0,0,.5)}
#prompt{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10;padding:9px 16px;border-radius:999px;background:rgba(4,24,43,.85);color:#fff;font-size:14px;font-weight:700;white-space:nowrap;pointer-events:none}
#prompt kbd{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:6px;background:var(--mint);color:#04324a;font-family:inherit;font-weight:800}
#toast{position:fixed;left:50%;top:max(16%,90px);transform:translateX(-50%);z-index:30;padding:12px 18px;border-radius:14px;background:rgba(4,24,43,.92);color:#fff;font-size:15px;font-weight:700;text-align:center;max-width:min(420px,90vw);line-height:1.5;pointer-events:none;opacity:0;transition:opacity .3s}
#toast.show{opacity:1}
#gauge{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:20;width:min(300px,80vw);padding:14px 16px;border-radius:16px;background:rgba(4,24,43,.9);color:#fff;text-align:center;font-weight:700}
#gauge i{display:block;height:10px;margin-top:10px;border-radius:5px;background:linear-gradient(90deg,var(--sky),var(--mint));transform-origin:left;transform:scaleX(0)}
#gauge s{display:block;height:10px;margin-top:-10px;border-radius:5px;background:rgba(255,255,255,.15)}

/* 대화창 */
#dialog{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;width:min(640px,calc(100vw - 24px));padding:16px 18px 14px;border-radius:18px;background:#fff;box-shadow:0 24px 60px -20px rgba(0,0,0,.6);animation:dlgIn .25s ease-out}
@keyframes dlgIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
#dname{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--deep);color:#fff;font-size:13px;font-weight:800}
#dtext{margin:10px 2px 0;font-size:16px;line-height:1.75;word-break:keep-all;white-space:pre-line;min-height:3.4em}
#dchoices{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#dchoices button{flex:1 1 auto;min-height:46px;padding:0 16px;border:1.5px solid #dae3ea;border-radius:12px;background:#f6f9fb;font-size:15px;font-weight:800;color:var(--navy)}
#dchoices button:hover,#dchoices button:focus-visible{border-color:var(--brand);background:#eaf2fb;outline:none}
#dchoices button.big{font-size:22px}
#dnext{display:block;margin:10px 0 0 auto;min-height:40px;padding:0 18px;border:0;border-radius:12px;background:var(--deep);color:#fff;font-weight:800}

/* 카드(재단 소개 · 체험 기념 카드) */
#card{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(4,24,43,.6);backdrop-filter:blur(4px)}
.cardbox{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px 22px 20px;border-radius:20px;background:#fff;box-shadow:0 30px 70px -20px rgba(0,0,0,.6)}
.cardbox h2{margin:0;font-size:22px;letter-spacing:-.04em}
.cardbox h3{margin:18px 0 6px;font-size:15px;color:var(--deep)}
.cardbox p,.cardbox li{font-size:14.5px;line-height:1.75;color:#3c4a56;word-break:keep-all}
.cardbox ul{margin:0;padding-left:18px}
.cardbox img{display:block;width:100%;border-radius:12px;margin-top:12px}
.cardbtns{display:flex;gap:8px;margin-top:16px}
.cardbtns button,.cardbtns a{flex:1;display:grid;place-items:center;min-height:46px;border:0;border-radius:12px;background:var(--deep);color:#fff;font-weight:800;text-decoration:none;font-size:15px}
.cardbtns .line{background:#eef2f5;color:var(--navy)}

/* 모바일 조작 */
#joy{position:fixed;left:calc(22px + env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom));z-index:12;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.5);touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 6px 16px rgba(0,0,0,.3)}
#act{position:fixed;right:calc(22px + env(safe-area-inset-right));bottom:calc(36px + env(safe-area-inset-bottom));z-index:12;width:84px;height:84px;border-radius:50%;border:0;background:var(--leaf);color:#fff;font-size:15px;font-weight:800;box-shadow:0 10px 24px -8px rgba(0,0,0,.55);line-height:1.2;padding:6px}
#act:disabled{background:rgba(255,255,255,.35);color:rgba(255,255,255,.85)}
@media (hover:hover) and (pointer:fine){#joy,#act{display:none}}
@media (max-width:560px){#top button span,#top .hm{display:none}#top button{padding:0 10px}#mission{font-size:12.5px}.stamp{width:30px;height:30px;font-size:14px}}
/* 업무 체험 미니게임 */
#mg{position:fixed;inset:0;z-index:35;display:grid;place-items:center;padding:16px;background:rgba(4,24,43,.55);backdrop-filter:blur(3px)}
.mgbox{width:min(560px,100%);padding:18px 18px 16px;border-radius:20px;background:#fff;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);animation:dlgIn2 .25s ease-out}
@keyframes dlgIn2{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.mgtag{display:inline-block;padding:3px 10px;border-radius:999px;background:#e8f6ef;color:var(--leaf);font-size:12px;font-weight:800}
#mgtitle{display:block;margin-top:6px;font-size:19px;letter-spacing:-.04em}
#mgsub{display:block;margin-top:4px;font-size:14px;color:#4a5864;line-height:1.6;word-break:keep-all}
#mgstage{position:relative;margin-top:12px;height:190px;border-radius:14px;background:linear-gradient(180deg,#0c3360,#14467e);overflow:hidden;color:#fff}
#mgbtns{display:flex;gap:8px;margin-top:12px}
#mgbtns button{flex:1;min-height:58px;border:0;border-radius:14px;background:var(--deep);color:#fff;font-size:16px;font-weight:800;touch-action:none;transition:background .15s,transform .1s}
#mgbtns button:active,#mgbtns button.on{background:var(--leaf);transform:scale(.98)}
#mgbtns button.alt{background:#e5533d}
#mgbtns button kbd{display:inline-block;margin-left:6px;padding:0 6px;border-radius:5px;background:rgba(255,255,255,.2);font-family:inherit;font-size:12px}
.mgk{position:absolute;left:16px;top:12px;right:16px;display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;opacity:.9}
.trk{position:absolute;left:16px;right:16px;top:70px;height:36px;border-radius:18px;background:rgba(255,255,255,.12)}
.zone{position:absolute;top:0;bottom:0;width:22%;margin-left:-11%;border-radius:18px;background:rgba(126,227,180,.3);border:2px solid #7ee3b4;transition:background .2s}
.zone.hit{background:rgba(126,227,180,.65)}
.ndl{position:absolute;top:-9px;bottom:-9px;width:8px;margin-left:-4px;border-radius:4px;background:#ffb547;box-shadow:0 0 12px #ffb547}
.trkl{position:absolute;left:16px;right:16px;top:114px;display:flex;justify-content:space-between;font-size:11.5px;opacity:.7}
.pg{position:absolute;left:16px;right:16px;bottom:18px;height:12px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--mint));transform-origin:left;transform:scaleX(0)}
.belt{position:absolute;left:0;right:0;bottom:34px;height:16px;background:repeating-linear-gradient(90deg,#5b6b78 0 18px,#46545f 18px 36px);animation:belt .6s linear infinite}
@keyframes belt{to{background-position:36px 0}}
.item{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;font-size:58px;line-height:1;transition:transform .35s,opacity .35s}
.item small{display:block;margin-top:8px;font-size:15px;font-weight:800}
.item.in{transform:translate(-50%,-50%) translateX(-140px);opacity:0}
.item.out{transform:translate(-50%,-50%) translateY(-90px) rotate(-20deg);opacity:0}
.item.new{transform:translate(-50%,-50%) translateX(160px);opacity:0;transition:none}
.fb{position:absolute;left:0;right:0;bottom:56px;text-align:center;font-size:13.5px;font-weight:700;color:var(--mint)}
.fb.bad{color:#ffb4a8}
.pipe{position:absolute;inset:0;width:100%;height:100%}
.puff{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border:0;border-radius:50%;background:radial-gradient(circle,rgba(230,214,170,.95) 30%,rgba(230,214,170,0) 70%);font-size:24px;animation:puff 1.9s ease-out forwards;cursor:pointer}
@keyframes puff{0%{transform:scale(.3);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(1.4) translateY(-14px);opacity:0}}
.puff.got{animation:none;background:radial-gradient(circle,rgba(126,227,180,.95) 30%,rgba(126,227,180,0) 70%);transform:scale(1.2)}
#nogl{position:fixed;inset:auto 16px 16px;z-index:60;padding:14px;border-radius:12px;background:#fff;font-size:14px}
</style>
</head>

<div id="app"></div>

</div>

  <a href="../index.html" id="b-home" style="display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.92);font-size:13px;font-weight:800;color:var(--navy);text-decoration:none;box-shadow:0 10px 26px -14px rgba(0,0,0,.5)">🏠<span class="hm"> 홈페이지</span></a>

  <p id="dtext"></p>

</div>

</div></div>
<div id="card" hidden><div class="cardbox" id="cardbox"></div></div>
<div id="joy" hidden><i></i></div>
<button id="act" type="button" hidden disabled>말 걸기</button>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   맑고푸른곶 시화호 체험관
   재단 사옥(가운데) · 측정·분석(동북) · 환경에너지센터(서북) · 컨설팅(동남) · 환경교육관(서남) · 시화호(남쪽)
   ============================================================ */

/* ---------- 저장 ---------- */
const KEY = 'cabc-game-v1';
const COLORS = ['#2e6fb7', '#0a9466', '#e5533d', '#f2b632', '#8b5cf6', '#ec6fa1'];
const blank = () => ({ name: '', color: COLORS[0], stamps: {}, drops: [], step: {} });
let S = blank();
try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch { S = blank(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { /* 저장 불가 */ } };

/* ---------- 업무 미션 ---------- */
const ZONES = {
  measure: { name: '측정·분석', icon: '🔬', title: '굴뚝 시료 채취·분석' },
  regen: { name: '활성탄 재생', icon: '♻️', title: '폐활성탄 수거·재생' },
  consult: { name: '환경컨설팅', icon: '🩺', title: '사업장 환경관리 진단' },
  edu: { name: '환경교육', icon: '📘', title: '환경관리인 OX 교실' },
};
const ORDER = ['measure', 'regen', 'consult', 'edu'];

/* 하늘 물방울 — 재단 이야기 (sh-cabc.or.kr 공개 정보) */
const DROPS = [
  { p: [-8, 6], t: '2004년, 시화지구 지속가능발전협의회가 4,471억원 규모의 환경개선 특별대책 로드맵에 합의했어요.' },
  { p: [12, -30], t: '2004년 12월부터 300억원 규모의 대기개선기금이 운영됐어요.' },
  { p: [-38, -26], t: '재단법인 맑고푸른곶은 2025년 9월 9일 창립총회를 열었어요.' },

let actx = null, soundOn = true;
function tone(freqs, dur = 0.12, type = 'sine', gap = 0.09) {
  if (!soundOn) return;
  try {
    actx = actx || new AudioContext();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * gap;
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.05);
    });
  } catch { /* 소리 불가 */ }
}

const mg = { box: $('mg'), title: $('mgtitle'), sub: $('mgsub'), stage: $('mgstage'), btns: $('mgbtns'), key: null };
function mgOpen(title, sub) { busy = true; ui.dialog.hidden = true; mg.title.textContent = title; mg.sub.innerHTML = sub; mg.stage.innerHTML = ''; mg.btns.innerHTML = ''; mg.box.hidden = false; }
function mgClose() { mg.box.hidden = true; mg.key = null; }

/* 1) 측정·분석 — 등속흡인: 배출가스 유속(초록 구간)에 흡인 속도(주황 바늘)를 맞춘다 */
function mgIsokinetic() {
  return new Promise((res) => {
    mgOpen('굴뚝 시료 채취 — 등속흡인', '굴뚝 속 배출가스 속도(<b style="color:#0a9466">초록 구간</b>)는 계속 바뀌어요. 버튼을 <b>누르고 있으면</b> 흡인 속도(<b style="color:#d98a00">주황 바늘</b>)가 올라가고, 떼면 내려가요. 바늘을 초록 구간 안에 두면 시료가 모여요.');
    mg.stage.innerHTML = '<div class="mgk"><span>배출가스 유속 ↔ 흡인 속도</span><span id="mgpct">시료 0%</span></div><div class="trk"><div class="zone" id="mgzone"></div><div class="ndl" id="mgndl"></div></div><div class="trkl"><span>느림</span><span>빠름</span></div><div class="pg"><i id="mgpg"></i></div>';
    const zone = $('mgzone'), ndl = $('mgndl'), pg = $('mgpg'), pct = $('mgpct');
    const b = mgButton('흡인 펌프 <kbd>Space 누르기</kbd>');
    let on = false, v = 0.2, prog = 0, t = 0, inside = 0, total = 0, last = performance.now(), done = false;
    const set = (x) => { on = x; b.classList.toggle('on', x); };
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); b.setPointerCapture(e.pointerId); set(true); });
    b.addEventListener('pointerup', () => set(false)); b.addEventListener('pointercancel', () => set(false));
    mg.key = (code, down) => { if (code === 'Space' || code === 'KeyE' || code === 'Enter') set(down); };
    const step = (now) => {
      if (done) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt; total += dt;
      const c = 0.5 + 0.26 * Math.sin(t * 0.9) + 0.08 * Math.sin(t * 2.3);
      v = Math.max(0, Math.min(1, v + (on ? 0.6 : -0.5) * dt));
      const hit = Math.abs(v - c) < 0.11;
      if (hit) { prog += dt / 5; inside += dt; }
      zone.style.left = c * 100 + '%'; zone.classList.toggle('hit', hit); ndl.style.left = v * 100 + '%';
      pg.style.transform = `scaleX(${Math.min(1, prog)})`; pct.textContent = `시료 ${Math.min(100, Math.round(prog * 100))}%`;
      if (prog >= 1) { done = true; sfx.ok(); setTimeout(() => { mgClose(); res(Math.round((inside / total) * 100)); }, 350); return; }
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

/* 2) 활성탄 재생 — 거점 수집 후 선별: 폐활성탄은 재생로로, 이물질은 골라낸다 */
const SORT_ITEMS = [
  { e: '⚫', n: '폐활성탄', ok: true }, { e: '🥫', n: '금속 캔', ok: false }, { e: '⚫', n: '폐활성탄', ok: true },
  { e: '🛍️', n: '비닐 봉투', ok: false }, { e: '⚫', n: '폐활성탄', ok: true }, { e: '🪨', n: '돌멩이', ok: false },
  { e: '⚫', n: '폐활성탄', ok: true }, { e: '⚫', n: '폐활성탄', ok: true },
];
function mgSort() {
  return new Promise((res) => {
    mgOpen('폐활성탄 선별 — 재생 전처리', '모아 온 자루에 이물질이 섞여 있어요. <b>폐활성탄</b>은 재생로에 넣고, 캔·비닐·돌 같은 <b>이물질</b>은 골라내 주세요.');
    mg.stage.innerHTML = '<div class="mgk"><span>재생로 ◀</span><span id="mgcnt">0 / 8</span></div><div class="belt"></div><div class="item" id="mgitem"></div><div class="fb" id="mgfb"></div>';
    const item = $('mgitem'), fb = $('mgfb'), cnt = $('mgcnt');
    const items = [...SORT_ITEMS].sort(() => Math.random() - 0.5);
    let i = 0, right = 0, lock = false;
    const show = () => { const it = items[i]; item.className = 'item new'; item.innerHTML = `${it.e}<small>${it.n}</small>`; void item.offsetWidth; item.className = 'item'; cnt.textContent = `${i} / ${items.length}`; lock = false; };
    const pick = (toKiln) => {
      if (lock) return; lock = true; const it = items[i], good = toKiln === it.ok;
      if (good) { right++; sfx.ok(); } else sfx.bad();
      fb.className = 'fb' + (good ? '' : ' bad');
      fb.textContent = good ? (it.ok ? '좋아요! 재생로로 투입' : '좋아요! 이물질 제거') : (it.ok ? '앗, 폐활성탄은 재생할 수 있어요' : '앗, 이물질이 들어가면 재생로가 고장 나요');
      item.className = 'item ' + (toKiln ? 'in' : 'out');
      setTimeout(() => { i++; if (i >= items.length) { mgClose(); res(right); } else show(); }, 520);
    };
    const bIn = mgButton('◀ 재생로 투입 <kbd>←</kbd>'), bOut = mgButton('이물질 제거 ✋ <kbd>→</kbd>', 'alt');
    bIn.onclick = () => pick(true); bOut.onclick = () => pick(false);
    mg.key = (code, down) => { if (!down) return; if (code === 'ArrowLeft' || code === 'KeyA') pick(true); if (code === 'ArrowRight' || code === 'KeyD') pick(false); };
    show();
  });
}

        setTimeout(() => p.remove(), 500); clearTimeout(timer);
        if (found >= 5) { done = true; setTimeout(() => { mgClose(); res(found); }, 500); } else timer = setTimeout(spawn, 450);

  <h3>조작</h3><ul><li>PC: W·A·S·D 또는 방향키로 이동, Shift 달리기, E·Space로 말 걸기·행동</li><li>휴대폰: 왼쪽 원을 밀어 이동, 오른쪽 버튼으로 말 걸기·행동</li></ul>
  <h3>목표</h3><ul><li>네 가지 업무를 체험하고 스탬프 4개를 모아요. 하나마다 하늘이 25%씩 맑아져요.</li><li>하늘 물방울 8개를 모으면 재단 이야기를 모두 들을 수 있어요.</li><li>곶이(초록 친구)에게 말을 걸면 팁을 알려 줘요.</li></ul>
  <p style="font-size:12.5px;color:#66737e">업무 내용은 재단 홈페이지의 공개 정보를 바탕으로 만들었고, 컨설팅 진단 상황 등은 체험용 예시예요. 진행 기록은 이 브라우저에만 저장돼요.</p>
  <div class="cardbtns"><button type="button" data-close>닫기</button></div>`);
}
function certImage() {
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1350; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 1080, 1350); g.addColorStop(0, '#0c3360'); g.addColorStop(0.6, '#23579c'); g.addColorStop(1, '#0b7652');
  x.fillStyle = g; x.fillRect(0, 0, 1080, 1350);
  x.fillStyle = '#fff'; x.beginPath(); x.roundRect(70, 70, 940, 1210, 48); x.fill();
  x.textAlign = 'center'; x.fillStyle = '#0a9466'; x.font = '800 40px Pretendard, sans-serif'; x.fillText('재단법인 맑고푸른곶', 540, 190);
  x.fillStyle = '#14202b'; x.font = '800 84px Pretendard, sans-serif'; x.fillText('시화호 체험관', 540, 300);
  x.font = '700 44px Pretendard, sans-serif'; x.fillStyle = '#23579c'; x.fillText('체험 기념 카드', 540, 372);
  x.font = '800 72px Pretendard, sans-serif'; x.fillStyle = '#14202b'; x.fillText(`${S.name || '체험자'} 님`, 540, 520);
  x.font = '600 36px Pretendard, sans-serif'; x.fillStyle = '#4a5864';
  x.fillText('측정·분석 · 활성탄 재생 · 환경컨설팅 · 환경교육', 540, 600);
  x.fillText('네 가지 업무를 모두 체험했어요', 540, 652);
  ORDER.forEach((k, i) => {
    const cx = 220 + i * 213, cy = 830;
    x.fillStyle = '#0a9466'; x.beginPath(); x.arc(cx, cy, 82, 0, Math.PI * 2); x.fill();
    x.font = '64px sans-serif'; x.fillStyle = '#fff'; x.fillText(ZONES[k].icon, cx, cy + 24);
    x.font = '700 28px Pretendard, sans-serif'; x.fillStyle = '#14202b'; x.fillText(ZONES[k].name, cx, cy + 140);
  });
  x.font = '600 32px Pretendard, sans-serif'; x.fillStyle = '#66737e';
  x.fillText(`하늘 물방울 ${S.drops.length} / 8  ·  ${new Date().toLocaleDateString('ko-KR')}`, 540, 1080);
  x.font = '600 26px Pretendard, sans-serif'; x.fillText('체험용 기념 카드입니다 · 공식 증명서가 아닙니다', 540, 1200);
  return c.toDataURL('image/png');
}
function showCert() {
  const url = certImage();
  openCard(`<h2>🎉 체험 완료!</h2><p>네 가지 업무를 모두 체험해 시화호 하늘을 맑게 만들었어요.</p><img src="${url}" alt="시화호 체험관 체험 기념 카드">
  <div class="cardbtns"><a href="${url}" download="맑고푸른곶-체험카드.png">카드 저장</a><button type="button" class="line" data-close>닫기</button></div>`);
}

/* ---------- HUD ---------- */
function refreshHud() {
  const st = $('stamps');
  st.querySelectorAll('.stamp').forEach((e) => e.remove());
  ORDER.forEach((k) => { const e = document.createElement('span'); e.className = 'stamp' + (S.stamps[k] ? ' on' : ''); e.title = ZONES[k].title; e.textContent = S.stamps[k] ? ZONES[k].icon : '·'; st.appendChild(e); });
  const g = currentGoal(); ui.mission.innerHTML = '🎯 ' + g.text;
  ui.drops.textContent = `💧 하늘 물방울 ${S.drops.length}/8 · 하늘 ${doneCount() * 25}% 맑음`;
}

/* ============================================================
   입력
   ============================================================ */
const keys = {};
let nextKey = null;
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (!mg.box.hidden) { if (mg.key) { e.preventDefault(); if (!e.repeat) mg.key(e.code, true); } return; }
  keys[e.code] = true;
  if (e.code === 'KeyE' || e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (!ui.card.hidden) { closeCard(); return; }
    if (nextKey) { nextKey(); return; }
    if (!busy) action();
  }
  if (e.code === 'Escape' && !ui.card.hidden) closeCard();
});
addEventListener('keyup', (e) => { keys[e.code] = false; if (!mg.box.hidden && mg.key) mg.key(e.code, false); });

/* 조이스틱 */
const joy = $('joy'), knob = joy.querySelector('i');
const stick = { x: 0, y: 0, id: null };
joy.addEventListener('pointerdown', (e) => { stick.id = e.pointerId; joy.setPointerCapture(e.pointerId); moveStick(e); });
joy.addEventListener('pointermove', (e) => { if (e.pointerId === stick.id) moveStick(e); });
const endStick = () => { stick.id = null; stick.x = stick.y = 0; knob.style.transform = ''; };
joy.addEventListener('pointerup', endStick); joy.addEventListener('pointercancel', endStick);
function moveStick(e) {
  const r = joy.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = (e.clientX - cx) / (r.width / 2), dy = (e.clientY - cy) / (r.height / 2); const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
  stick.x = dx; stick.y = dy; knob.style.transform = `translate(${dx * 34}px, ${dy * 34}px)`;
}
ui.act.addEventListener('click', () => { if (nextKey) nextKey(); else if (!busy) action(); });

let near = null, nearGotti = false;
function action() {
  if (near) near.run();
  else if (nearGotti) talkGotti();
}

/* ============================================================
   루프
   ============================================================ */
const clock = new THREE.Clock();
const vel = new THREE.Vector3();
const camTarget = new THREE.Vector3();
let skyT = doneCount() / 4, regenFx = 0, elapsed = 0;
camera.position.set(0, 13, 18);

function collide(p) {
  for (const c of colliders) {
    const cx = Math.max(c.x1, Math.min(p.x, c.x2)), cz = Math.max(c.z1, Math.min(p.z, c.z2));
    const dx = p.x - cx, dz = p.z - cz, d = Math.hypot(dx, dz), r = 0.5;
    if (d < r) {
      if (d > 0.0001) { p.x = cx + (dx / d) * r; p.z = cz + (dz / d) * r; }
      else { const opts = [[c.x1 - r - p.x, 0], [c.x2 + r - p.x, 0], [0, c.z1 - r - p.z], [0, c.z2 + r - p.z]].sort((a, b) => Math.abs(a[0] + a[1]) - Math.abs(b[0] + b[1])); p.x += opts[0][0]; p.z += opts[0][1]; }
    }
  }
  p.x = Math.max(-50, Math.min(50, p.x)); p.z = Math.max(-44, Math.min(27.2, p.z));
}

function tick() {
  const dt = Math.min(0.05, clock.getDelta()); elapsed += dt;

  /* 이동 */
  let ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + stick.x;
  let iz = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0) + stick.y;
  const il = Math.hypot(ix, iz); if (il > 1) { ix /= il; iz /= il; }
  const run = keys.ShiftLeft || keys.ShiftRight || Math.hypot(stick.x, stick.y) > 0.95;
  const max = busy ? 0 : run ? 9 : 5.5;
  vel.x += (ix * max - vel.x) * Math.min(1, dt * 10); vel.z += (iz * max - vel.z) * Math.min(1, dt * 10);
  const p = player.g.position; p.x += vel.x * dt; p.z += vel.z * dt; collide(p);
  const sp = Math.hypot(vel.x, vel.z);
  if (sp > 0.3) { const ty = Math.atan2(vel.x, vel.z); let d = ty - player.g.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); player.g.rotation.y += d * Math.min(1, dt * 12); }
  animPerson(player, sp, dt);

  /* 카메라 */
  camTarget.set(p.x, 0, p.z);
  const zoom = camera.aspect < 1 ? 1.65 : camera.aspect < 1.3 ? 1.25 : 1; /* 세로 화면은 더 멀리서 */
  const want = new THREE.Vector3(p.x, 13 * zoom, p.z + 16 * zoom);
  camera.position.lerp(want, Math.min(1, dt * 4)); camera.lookAt(camTarget.x, 1.4, camTarget.z - 1);
  sun.position.set(p.x - 30, 50, p.z + 20); sun.target.position.set(p.x, 0, p.z);

  /* 곶이 — 뒤따라 통통 */
  const ry = player.g.rotation.y;
  const behind = new THREE.Vector3(p.x - Math.sin(ry) * 0.9 + Math.cos(ry) * 1.5, 0, p.z - Math.cos(ry) * 0.9 - Math.sin(ry) * 1.5);
  gotti.position.lerp(behind, Math.min(1, dt * 3)); gotti.position.y = Math.abs(Math.sin(elapsed * 5)) * 0.35;
  gotti.lookAt(p.x, gotti.position.y, p.z);

  /* 사람들 숨쉬기 · 느낌표 */
  const goal = currentGoal();
  for (const [id, n] of Object.entries(NPCS)) {
    n.p.g.children[4].position.y = 1.2 + Math.sin(elapsed * 2 + n.pos.x) * 0.02;
    n.ex.visible = goal.id === id && goal.at === n.pos;
    n.ex.position.y = 3.45 + Math.sin(elapsed * 4) * 0.12;
    n.p.g.rotation.y += (Math.atan2(p.x - n.pos.x, p.z - n.pos.z) - n.p.g.rotation.y) * (p.distanceTo(n.pos) < 6 ? dt * 3 : 0);
  }

  /* 목표 · 방향 안내 */
  beacon.position.set(goal.at.x, 0, goal.at.z); bArrow.position.y = 4.2 + Math.sin(elapsed * 4) * 0.35; bArrow.rotation.y += dt * 2;
  bRing.scale.setScalar(1 + Math.sin(elapsed * 4) * 0.08);
  const gd = new THREE.Vector3(goal.at.x - p.x, 0, goal.at.z - p.z), gl = gd.length();
  guide.visible = gl > 5; if (guide.visible) { gd.normalize(); guide.position.set(p.x + gd.x * 1.6, 0.35, p.z + gd.z * 1.6); guide.rotation.set(Math.PI / 2, 0, -Math.atan2(gd.x, gd.z) + Math.PI, 'YXZ'); guide.lookAt(p.x + gd.x * 3, 0.35, p.z + gd.z * 3); guide.rotateX(Math.PI / 2); }

  /* 가까운 상호작용 */
  near = null; let best = 99;
  for (const it of interactables()) { const d = Math.hypot(it.pos.x - p.x, it.pos.z - p.z); if (d < it.r && d < best) { best = d; near = it; } }
  nearGotti = !near && gotti.position.distanceTo(p) < 2.6;
  const lab = near ? near.label : nearGotti ? '곶이와 대화' : '';
  if (!busy && lab) { ui.prompt.hidden = mobile; ui.prompt.innerHTML = `<kbd>E</kbd>${lab}`; ui.act.disabled = false; ui.act.textContent = lab; }
  else { ui.prompt.hidden = true; ui.act.disabled = !nextKey; ui.act.textContent = nextKey ? '다음' : '말 걸기'; }

  /* 물방울 */
  dropMeshes.forEach((m, i) => {
    if (!m.visible) return; m.position.y = 1.2 + Math.sin(elapsed * 2 + i) * 0.25; m.rotation.y += dt;
    if (!busy && Math.hypot(m.position.x - p.x, m.position.z - p.z) < 1.4) {
      m.visible = false; S.drops.push(i); save(); sfx.drop(); burst(m.position.clone(), '#8fd6f4', 24);
      toast(`💧 하늘 물방울 ${S.drops.length}/8<br>${DROPS[i].t}`, 4200); refreshHud();
    }
  });

  /* 하늘 — 스탬프 수만큼 맑아진다 */
  skyT += (doneCount() / 4 - skyT) * Math.min(1, dt * 1.2);
  scene.background.copy(HAZE).lerp(CLEAR, skyT); scene.fog.color.copy(scene.background);
  scene.fog.near = 18 + skyT * 40; scene.fog.far = 70 + skyT * 150;
  sun.intensity = 0.9 + skyT * 0.6; hemi.intensity = 0.8 + skyT * 0.35;
  dust.material.opacity = 0.7 * (1 - skyT); dust.visible = skyT < 0.98;
  const dpos = dust.geometry.attributes.position;
  for (let i = 0; i < dustN; i++) { let x = dpos.getX(i) + dt * 0.8; if (x > 50) x = -50; dpos.setX(i, x); }
  dpos.needsUpdate = true;
  waterMat.color.set('#6f8a8f').lerp(new THREE.Color('#3f8fc9'), skyT);
  birds.visible = skyT > 0.45;
  if (birds.visible) { birds.position.set(((elapsed * 4) % 140) - 70, 16, 10 + Math.sin(elapsed * 0.3) * 8); birds.children.forEach((b, i) => b.children.forEach((w) => { w.rotation.z = w.userData.s * Math.sin(elapsed * 8 + i) * 0.5; })); }
  rainbow.visible = skyT > 0.9; rainbow.children.forEach((r) => { r.material.opacity = Math.max(0, (skyT - 0.9) * 5.5); });
  treeSpots.length && scene.children.forEach(() => {});

  /* 연출 */
  vanLamp.material = M(Math.sin(elapsed * 8) > 0 ? '#ff6b5e' : '#7a2a24');
  flag.rotation.y = Math.sin(elapsed * 2) * 0.15;
  if (regenFx > 0) { regenFx -= dt; kilnGlow.material.emissiveIntensity = 0.6 + Math.sin(elapsed * 14) * 0.4; } else kilnGlow.material.emissiveIntensity = 0.3;
  dropZone.material.opacity = stepOf('regen') === 1 && (S.bags || []).length === 3 ? 0.6 + Math.sin(elapsed * 5) * 0.3 : 0.25;
  spotMarks.forEach((m, i) => { m.visible = stepOf('consult') === 1 && !(S.spots || []).includes(i); m.position.y = 3.2 + Math.sin(elapsed * 4 + i) * 0.15; });
  TOWERS.forEach((t, i) => { if (stepOf('regen') === 1 && !(S.bags || []).includes(i)) t.bag.rotation.y += dt; });
  dikeCars.forEach((c) => { c.t = (c.t + dt * 0.02 * c.dir + 1) % 1; const u = (c.t - 0.5) * 220; c.m.position.set(30 + u * Math.cos(-0.28) , 0.9, 62 - u * Math.sin(-0.28) + (c.dir > 0 ? 0.6 : -0.6)); c.m.rotation.y = -0.28; });
  const wp = water.geometry.attributes.position;
  for (let i = 0; i < wp.count; i++) wp.setZ(i, Math.sin(wp.getX(i) * 0.12 + elapsed) * 0.12 + Math.cos(wp.getY(i) * 0.15 + elapsed * 0.8) * 0.1);
  wp.needsUpdate = true;
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i]; b.life -= dt; const a = b.pts.geometry.attributes.position;
    b.v.forEach((v, k) => { v.y -= 9 * dt; a.setXYZ(k, a.getX(k) + v.x * dt, a.getY(k) + v.y * dt, a.getZ(k) + v.z * dt); });
    a.needsUpdate = true; b.pts.material.opacity = Math.max(0, b.life / 1.6);
    if (b.life <= 0) { scene.remove(b.pts); b.pts.geometry.dispose(); bursts.splice(i, 1); }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

/* ============================================================
   시작
   ============================================================ */
const sw = $('swatches');
COLORS.forEach((c) => {
  const b = document.createElement('button'); b.type = 'button'; b.style.background = c; b.setAttribute('aria-label', '옷 색 ' + c); b.setAttribute('aria-pressed', String(c === S.color));
  b.onclick = () => { S.color = c; sw.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); player.g.children.forEach((m) => { if (m.isMesh && m.geometry.type === 'CapsuleGeometry') m.material = M(c); }); player.arms.forEach((a) => (a.children[0].material = M(c))); };
  sw.appendChild(b);
});
$('nick').value = S.name;
$('reset').onclick = () => { if (confirm('진행 기록을 지우고 처음부터 할까요?')) { localStorage.removeItem(KEY); location.reload(); } };
$('go').onclick = () => {
  S.name = $('nick').value.trim().slice(0, 10); save();
  player.g.remove(nameTag); const t = label(S.name || '체험자', { bg: 'rgba(4,24,43,.75)', size: 0.55 }); t.position.y = 2.75; player.g.add(t);
  $('start').hidden = true; $('hud').hidden = false; $('top').hidden = false;
  if (mobile) { $('joy').hidden = false; $('act').hidden = false; }
  tone([523, 784], 0.16);
  refreshHud();
  if (!S.met) setTimeout(() => toast('🌱 곶이: 안녕! 재단 사옥 앞 <b>안내 직원</b>에게 먼저 가 보자!', 4200), 600);
};
$('b-about').onclick = showAbout;
$('b-help').onclick = showHelp;
$('b-sound').onclick = (e) => { soundOn = !soundOn; e.currentTarget.textContent = soundOn ? '🔊' : '🔇'; e.currentTarget.setAttribute('aria-pressed', String(soundOn)); };
ui.cardbox.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeCard(); });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* 이어 하기 — 이미 끝낸 진행 상태 반영 */
(S.bags || []).forEach((i) => { if (stepOf('regen') === 1) TOWERS[i].bag.visible = false; });
if (S.stamps.regen) TOWERS.forEach((t) => { t.bag.children[0].material = M('#7ee3b4'); });

window.__ready = true;
if (location.search.includes('debug')) window.__cabc = { S, player, interactables, currentGoal, get near() { return near; }, action, mgIsokinetic, mgSort, mgOdor };
refreshHud();
requestAnimationFrame(tick);
</script>
